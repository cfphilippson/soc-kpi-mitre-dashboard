<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI CSIRT — SIEM & MITRE</title>
<style>
:root{--bg:#0E1621;--panel:#17202A;--panel2:#1C2526;--ink:#E8EDF2;--muted:#8A9BA8;--line:#2A3743;
--brand:#27AE60;--accent:#42A5F5;--warn:#E0A64B;--crit:#E05C5C;
--c1:#27AE60;--c2:#42A5F5;--c3:#E0A64B;--c4:#B57BD8;--cov:#1B6B3A;--cov-b:#27AE60;--part:#256b45;--part-b:#3fae78;--none:#1C2E35;--none-b:#37474F;--sub-cov:#22794a;--sub-cov-b:#38c07a;--new-b:#42A5F5;color-scheme:dark;}
:root[data-theme="light"]{--bg:#EEF1F4;--panel:#FFFFFF;--panel2:#F4F6F8;--ink:#1B2733;--muted:#5B6B78;--line:#D7DEE4;--brand:#1B6B3A;--accent:#1565C0;--cov:#1B6B3A;--cov-b:#27AE60;--part:#8fd6ac;--part-b:#27AE60;--none:#E4E9ED;--none-b:#B7C2CC;--sub-cov:#cdeedd;--sub-cov-b:#27AE60;--new-b:#1565C0;color-scheme:light;}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.4}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.appbar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.appbar img{height:42px}
.appbar h1{font-size:16px;margin:0;font-weight:700}
.appbar .sub{font-size:12px;color:var(--muted);margin:0}
.appbar .sp{flex:1}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
select,.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
select:hover,.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.tabs{flex:none;display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--ink);border-bottom-color:var(--brand)}
.content{flex:1;min-height:0;overflow:auto;padding:16px 18px}
.view[hidden]{display:none}
.grid{display:grid;gap:12px}
.g6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:.2px}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px}
.kpi .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.kpi .d{font-size:12px;margin-top:4px}
.up{color:var(--brand)}.down{color:var(--crit)}.flat{color:var(--muted)}
.card.kpi{border-left:3px solid var(--line)}
.card.kpi.t-ok{border-left-color:var(--c1)}   .card.kpi.t-ok .v{color:var(--c1)}
.card.kpi.t-warn{border-left-color:var(--c3)} .card.kpi.t-warn .v{color:var(--c3)}
.card.kpi.t-bad{border-left-color:var(--crit)}.card.kpi.t-bad .v{color:var(--crit)}
.card.kpi.t-acc{border-left-color:var(--c2)}  .card.kpi.t-acc .v{color:var(--c2)}
.card.kpi .v small{color:var(--muted)!important}
/* ===== CSIRT ===== */
#v-soc{--sevC:#B57BD8;--sevH:#E05C5C;--sevM:#E0A64B;--sevL:#27AE60}
#v-soc .row{display:grid;gap:12px;margin-bottom:12px}
#v-soc .r3{grid-template-columns:repeat(3,1fr)}
#v-soc .r4{grid-template-columns:repeat(4,1fr)}
#v-soc .r2{grid-template-columns:1fr 1fr}
#v-soc .r21{grid-template-columns:1fr 2fr}
@media(max-width:900px){#v-soc .r3,#v-soc .r4,#v-soc .r2,#v-soc .r21{grid-template-columns:1fr}}
#v-soc h3{font-size:14px;margin:0 0 10px;font-weight:700}
#v-soc h3 small{color:var(--muted);font-weight:500}
#v-soc .funnel{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
#v-soc .ftier{color:#fff;border-radius:8px;padding:12px 10px;text-align:center;font-size:14px;line-height:1.3}
#v-soc .ftier b{font-size:16px}
#v-soc .sevleg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
#v-soc .sevleg .it{display:flex;gap:5px;align-items:center}
#v-soc .sevleg .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
#v-soc .ev{display:flex;flex-direction:column;gap:7px}
#v-soc .evrow{display:flex;align-items:center;gap:8px}
#v-soc .evm{width:60px;font-size:12px;color:var(--muted);text-align:right;flex:none}
#v-soc .evbar{flex:1;display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--panel2)}
#v-soc .evseg{display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#fff;font-weight:600;min-width:0}
#v-soc .therm{position:relative;height:74px;border-radius:8px;overflow:hidden;display:flex;margin-top:6px}
#v-soc .tzone{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:#0c1420;font-weight:700;opacity:.9}
#v-soc .tdot{position:absolute;top:34px;width:12px;height:12px;border-radius:50%;background:#2F81F7;border:2px solid #fff;transform:translateX(-50%);box-shadow:0 0 0 3px rgba(47,129,247,.3)}
#v-soc .tlab{position:absolute;top:50px;font-size:10.5px;color:var(--ink);transform:translateX(-50%);white-space:nowrap}
#v-soc .tcur{font-size:12px;color:var(--muted);margin-top:6px}
#v-soc ul.pts{margin:0;padding-left:18px;font-size:14px;line-height:1.55}
#v-soc ul.pts li{margin-bottom:5px}
#v-soc .csupd{font-size:12px;color:var(--muted);margin:2px 0 12px}
#cs_head{margin-bottom:6px}
.csper{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.csper-l{font-size:13px;color:var(--muted);font-weight:600;margin-right:2px}
.cschip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:5px 13px;font:13px 'Segoe UI';cursor:pointer;transition:.12s}
.cschip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.cschip.csall{background:transparent;border-style:dashed;color:var(--muted);font-weight:600}
.cschip:hover{filter:brightness(1.1)}
/* sub-abas Eng. Detecção */
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 12px;overflow-x:auto}
.subtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;cursor:pointer;white-space:nowrap}
.subtab.active{color:var(--ink);border-bottom-color:var(--brand)}
#v-eng:not([hidden]){display:flex;flex-direction:column}
/* termômetro legível */
#v-soc .tcurbig,#v-soc .tcurbig{font-size:15px;color:var(--muted);margin-bottom:4px}
#v-soc .tbadge,#v-soc .tbadge{color:#0c1420;font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;margin-left:6px}
#v-soc .thermwrap,#v-soc .thermwrap{position:relative;margin:26px 0 22px}
#v-soc .thermbar,#v-soc .thermbar{position:relative;height:54px;border-radius:10px;overflow:hidden;display:flex}
#v-soc .tdot2,#v-soc .tdot2{position:absolute;top:27px;width:16px;height:16px;border-radius:50%;border:2px solid var(--panel);transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px rgba(255,255,255,.4);z-index:2}
#v-soc .tdlab,#v-soc .tdlab{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap;background:var(--panel);padding:0 4px;border-radius:4px}
#v-soc .tptr,#v-soc .tptr{position:absolute;top:-14px;transform:translateX(-50%);color:var(--ink);font-size:13px;text-align:center;line-height:1}
#v-soc .tptr .tval,#v-soc .tptr .tval{font-weight:700;white-space:nowrap;margin-bottom:1px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-block}
#v-soc .tchips,#v-soc .tchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
#v-soc .tchip,#v-soc .tchip{border:1.5px solid;border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
/* FP */
#cs_fp .rank{display:flex;flex-direction:column;gap:9px}
#cs_fp .rrow{display:flex;align-items:center;gap:10px}
#cs_fp .rname{width:150px;font-size:13px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cs_fp .rbar{flex:1;height:18px;background:var(--panel2);border-radius:5px;overflow:hidden}
#cs_fp .rbar>i{display:block;height:100%;border-radius:5px;background:var(--crit)}
#cs_fp .rval{width:58px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#cs_fp table{width:100%;border-collapse:collapse;font-size:13px}
#cs_fp th,#cs_fp td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
#cs_fp th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
#cs_fp td.n,#cs_fp th.n{text-align:right;font-variant-numeric:tabular-nums}
#cs_fp .hm{display:grid;gap:4px;font-size:12px}
#cs_fp .hm .hd{color:var(--muted);text-align:center;padding:4px}
#cs_fp .hm .rl{color:var(--ink);display:flex;align-items:center}
#cs_fp .hm .cell{border-radius:5px;padding:9px 4px;text-align:center;font-weight:700}
.callout{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2)}
.callout .ic{font-size:18px;flex:none}.callout.good{border-color:#2b6b45}.callout.warn{border-color:#7a5e2a}.callout.info{border-color:#385a7a}
.callout b{display:block;font-size:13px;margin-bottom:2px}.callout p{margin:0;font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:160px 1fr 74px;gap:12px;align-items:center;font-size:14px}
.bar .bl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{height:20px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bfill{height:100%;border-radius:7px 0 0 7px}
.bval{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.seg{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.seg>div{display:flex;align-items:center;justify-content:center;font-size:13px;color:#0c1a12;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend .it{display:flex;gap:5px;align-items:center}.legend .d{width:10px;height:10px;border-radius:2px}
svg{display:block;width:100%;height:auto;min-height:300px}.axis{fill:var(--muted);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;font-weight:600}
.pill.ok{background:#1c3b28;color:#7fe0a8}.pill.bad{background:#3b1f1f;color:#f0a0a0}
.nodata{color:var(--muted);font-size:13px;padding:8px 2px}
.hltxt{font-size:13px;line-height:1.65;color:var(--ink)}
.hltxt .none{color:var(--muted)}
#v-mitre .mkpis{flex:none;display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px}
#v-mitre .kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:104px}
#v-mitre .kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
#v-mitre .kpi .v small{font-size:13px;color:var(--muted);font-weight:600}
#v-mitre .kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
#v-mitre .content{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0 18px 14px}
#v-mitre .view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#v-mitre .view[hidden]{display:none}
#v-mitre .controls{flex:none;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
#v-mitre .controls input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:14px;min-width:220px;font-family:inherit}
#v-mitre .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
#v-mitre .legend .it{display:flex;gap:6px;align-items:center}
#v-mitre .sw{width:14px;height:14px;border-radius:3px;border:1.5px solid}
#v-mitre .sw.cov{background:var(--cov);border-color:var(--cov-b)}
#v-mitre .sw.part{background:var(--part);border-color:var(--part-b)}
#v-mitre .sw.none{background:var(--none);border-color:var(--none-b)}
#v-mitre .sw.new{background:transparent;border-color:var(--new-b);position:relative}
#v-mitre .sw.new::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--new-b)}
#v-mitre label.tog{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
#v-mitre .fit{overflow:auto;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
#v-mitre .matrix{display:flex;gap:5px;padding:10px;align-items:flex-start;width:max-content}
#v-mitre .col{flex:0 0 auto;width:132px;display:flex;flex-direction:column;gap:4px}
#v-mitre .chead{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 6px;text-align:center}
#v-mitre .chead .nm{font-size:12px;font-weight:700;line-height:1.2;min-height:26px;display:flex;align-items:center;justify-content:center;overflow-wrap:break-word;word-break:break-word}
#v-mitre .chead .ct{font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
#v-mitre .chead .bar{height:3px;border-radius:2px;background:var(--none-b);margin-top:5px;overflow:hidden}
#v-mitre .chead .bar>i{display:block;height:100%;background:var(--cov-b)}
#v-mitre .tw{display:flex;flex-direction:column}
#v-mitre .cell{border-radius:5px;padding:5px 6px;font-size:11.5px;line-height:1.3;border:1.5px solid;position:relative;min-height:32px;display:flex;align-items:flex-start;gap:4px}
#v-mitre .cell.has{cursor:pointer}
#v-mitre .cell.existing{background:var(--cov);border-color:var(--cov-b);color:#fff}
#v-mitre .cell.partial{background:var(--part);border-color:var(--part-b);color:#fff}
#v-mitre .cell.none{background:var(--none);border-color:var(--none-b);color:var(--muted)}
#v-mitre .cell.dim{opacity:.16}
#v-mitre .cell .car{font-size:10px;opacity:.8;transition:transform .12s;flex:none;margin-top:2px}
#v-mitre .cell.open .car{transform:rotate(90deg)}
#v-mitre .cell .tx{flex:1 1 auto;min-width:0;overflow-wrap:break-word;word-break:break-word;hyphens:auto}
#v-mitre .cell .sc{font-variant-numeric:tabular-nums;opacity:.9;font-size:10.5px;flex:none;align-self:flex-start;margin-left:2px}
#v-mitre .cell .badge{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--new-b);border:1.5px solid var(--panel)}
#v-mitre .subs{display:flex;flex-direction:column;gap:2px;margin:2px 0 2px 8px;padding-left:6px;border-left:1px dashed var(--line)}
#v-mitre .subs[hidden]{display:none}
#v-mitre .scell{border-radius:4px;padding:3px 5px;font-size:11px;line-height:1.2;border:1px solid;position:relative;display:flex;gap:4px;align-items:flex-start}
#v-mitre .scell.cov{background:var(--sub-cov);border-color:var(--sub-cov-b);color:#fff;cursor:default}
#v-mitre .scell.unc{background:transparent;border-color:var(--none-b);color:var(--muted)}
#v-mitre .scell .sid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;opacity:.85;flex:none}
#v-mitre .scell .snm{flex:1 1 auto;min-width:0;overflow-wrap:break-word;word-break:break-word}
#v-mitre .scell .sbadge{width:7px;height:7px;border-radius:50%;background:var(--new-b);flex:none;margin-top:2px}
#v-mitre.septonly .cell:not(.sep){opacity:.13}
#v-mitre.septonly .scell.unc{opacity:.2}
#v-mitre .scroll{overflow:auto;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px}
#v-mitre .rrow{display:grid;grid-template-columns:180px 1fr 128px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
#v-mitre .rrow:last-child{border-bottom:none}
#v-mitre .rrow .rn{font-size:13px;font-weight:600}
#v-mitre .rrow .rn small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
#v-mitre .rtrack{height:16px;background:var(--none);border:1px solid var(--none-b);border-radius:8px;overflow:hidden}
#v-mitre .rfill{height:100%;background:linear-gradient(90deg,var(--part-b),var(--cov-b));border-radius:8px 0 0 8px}
#v-mitre .rval{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
#v-mitre .rval b{color:var(--ink);font-size:15px}
#v-mitre .gaphead{flex:none;font-size:13px;color:var(--muted);margin:6px 2px}
#v-mitre .glist{display:flex;flex-direction:column;gap:4px}
#v-mitre .gitem{display:flex;gap:10px;align-items:center;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:7px}
#v-mitre .gtac{font-size:11.5px;color:var(--muted);flex:none;width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v-mitre .gid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--accent);flex:none;width:62px}
#v-mitre .gnm{flex:1 1 auto;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#v-mitre .gmeta{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#v-mitre .gmeta .pill{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--none);border:1px solid var(--none-b);margin-left:6px}
#v-mitre .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
#v-mitre .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
#v-mitre .card .ct{display:flex;gap:8px;align-items:center;margin-bottom:6px}
#v-mitre .card .tp{font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:9px;background:var(--new-b);color:#fff}
#v-mitre .card .tp.eql{background:#6A4CAB}
#v-mitre .card .tp.esql{background:#1565C0}
#v-mitre .card .dt{font-size:12px;color:var(--muted);margin-left:auto}
#v-mitre .card h3{font-size:14px;margin:0 0 8px;font-weight:600;line-height:1.3}
#v-mitre .card .mp{font-size:12px;color:var(--muted);margin:3px 0}
#v-mitre .card .mp b{color:var(--ink)}
#v-mitre .card .mp .su{color:var(--sub-cov-b)}
#v-mitre .evsel{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
#v-mitre .mchip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:6px 14px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
#v-mitre .mchip:hover{border-color:var(--brand)}
#v-mitre .mchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
#v-mitre .evchart{width:100%;height:auto;display:block}
#v-mitre .evcard{margin-bottom:14px}
#v-mitre .evcard h3 small{color:var(--muted);font-weight:500;font-size:13px}
.mtip{position:fixed;z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-width:320px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .1s}
.mtip.on{opacity:1}
.mtip .tid{color:var(--accent);font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mtip .tnm{font-weight:600;margin:2px 0 6px}
.mtip .st{display:inline-block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:10px;margin-bottom:6px}
.mtip .st.existing{background:var(--cov);color:#fff}
.mtip .st.partial{background:var(--part);color:#fff}
.mtip .st.none{background:var(--none);color:var(--muted)}
.mtip .rl{color:var(--muted);margin-top:5px;font-size:12px}
.mtip .rl b{color:var(--ink);font-weight:600}
.mtip .sep{color:var(--new-b);font-weight:600;margin-top:5px;font-size:12px}
#v-mitre .loading{padding:30px;color:var(--muted)}
#v-mitre{gap:0}
#v-mitre .mtabs{flex:none;display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 8px;overflow-x:auto}
#v-mitre .mtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:8px 12px;cursor:pointer;white-space:nowrap}
#v-mitre .mtab.active{color:var(--ink);border-bottom-color:var(--brand)}
#v-mitre .mkpis{flex:none;display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
#v-mitre .miupd{flex:none;font-size:12px;color:var(--muted);margin:0 2px 10px}
#v-mitre .mviews{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#v-mitre .mview{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#v-mitre .mview[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <div style="width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#27AE60,#1565C0);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px">SOC</div>
    <div><h1>KPI Executivo/Operacional — CSIRT</h1><p class="sub" id="subUpd">Cibersegurança</p></div>
    <div class="sp"></div>
    <span id="perCtrl" class="ctrl"><label for="mes">Período</label><select id="mes"></select></span>
    <button class="btn" id="fs">⛶ Tela cheia</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-v="soc" id="tabSoc">SOC + CSIRT</button>
    <button class="tab" data-v="eng" id="tabEng">Eng. Detecção</button>
  </div>
  <div class="content">
    <div class="view" id="v-soc"><div id="cs_head"></div><div class="subtabs" id="soctabs"><button class="subtab active" data-sq="csirt">Visão geral CSIRT</button><button class="subtab" data-sq="fp">Falsos Positivos</button></div><div id="cs_body"><div class="loading">Carregando KPIs do CSIRT…</div></div><div id="cs_fp" hidden></div></div>
    <div class="view" id="v-eng" hidden>
      <div class="subtabs" id="engtabs">
        <button class="subtab active" data-sv="geral">Visão geral</button>
        <button class="subtab" data-sv="deteccao">Detecção</button>
        <button class="subtab" data-sv="alertas">Alertas</button>
        <button class="subtab" data-sv="capacidade">Capacidade &amp; Ativos</button>
        <button class="subtab" data-sv="mitre">Cobertura MITRE</button>
      </div>
      <div class="view" id="v-geral" hidden></div>
      <div class="view" id="v-deteccao" hidden></div>
      <div class="view" id="v-alertas" hidden></div>
      <div class="view" id="v-capacidade" hidden></div>
      <div class="view" id="v-mitre" hidden><div class="mtabs" id="mi_tabs"><button class="mtab active" data-mv="matriz">Matriz ATT&CK</button><button class="mtab" data-mv="resumo">Resumo por tática</button><button class="mtab" data-mv="gaps">Gaps prioritários</button><button class="mtab" data-mv="setembro">Casos do mês</button></div><div class="mkpis" id="mi_kpis"></div><div class="miupd" id="mi_upd"></div><div class="mviews"><div class="mview" id="miv-matriz"><div class="controls"><input type="search" id="mi_q" placeholder="Filtrar por técnica, subtécnica, ID ou regra…" aria-label="Filtrar"><label class="tog"><input type="checkbox" id="mi_exptog"> Expandir subtécnicas cobertas</label><label class="tog"><input type="checkbox" id="mi_septog"> Só casos do mês</label><div class="legend"><span class="it"><span class="sw cov"></span>Total</span><span class="it"><span class="sw part"></span>Parcial</span><span class="it"><span class="sw none"></span>Sem cobertura</span><span class="it"><span class="sw new"></span>Caso do mês</span></div></div><div class="fit" id="mi_fit"><div class="matrix" id="mi_matrix"><div class="loading">Carregando cobertura do Elastic…</div></div></div></div><div class="mview" id="miv-resumo" hidden><div class="scroll" id="mi_resumo"></div></div><div class="mview" id="miv-gaps" hidden><div class="scroll" id="mi_gaps"></div></div><div class="mview" id="miv-setembro" hidden><div class="scroll" id="mi_setembro"></div></div></div><div class="mtip" id="mi_tip" role="tooltip" aria-hidden="true"></div></div>
    </div>
  </div>
</div>
<script>
var DATA=null;
var E=[];
var fmt=function(n){return (n==null?'—':n.toLocaleString('pt-BR'));};
var pct=function(a,b){return b?Math.round(a/b*100):0;};
var findM=function(arr,m){for(var i=0;i<arr.length;i++)if(arr[i].m===m)return arr[i];return null;};
window.__setUpd=function(ts){var e=document.getElementById('subUpd');if(!e)return;
  var t=(ts&&ts!=='snapshot')?ts:new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  e.textContent='Cibersegurança · atualizado em '+t;};

document.getElementById('fs').addEventListener('click',function(){try{var e=document.documentElement;document.fullscreenElement?document.exitFullscreen():e.requestFullscreen&&e.requestFullscreen();}catch(x){}});
function curSub(){var a=document.querySelector('#engtabs .subtab.active');return a?a.dataset.sv:'geral';}
function showPer(){ // mostra o seletor global de período só nas sub-abas operacionais
  var soc=!document.getElementById('v-soc').hidden;
  var vis=(!soc)&&(curSub()!=='mitre');
  var pc=document.getElementById('perCtrl');if(pc)pc.style.display=vis?'':'none';
}
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('#tabs .tab').forEach(function(t){t.classList.toggle('active',t===b);});
  var v=b.dataset.v;
  document.getElementById('v-soc').hidden=(v!=='soc');
  document.getElementById('v-eng').hidden=(v!=='eng');
  if(v==='soc'&&window.__loadCsirt)window.__loadCsirt();
  if(v==='eng'){ // ativa a sub-aba corrente
    var sv=curSub();
    ['geral','deteccao','alertas','capacidade','mitre'].forEach(function(k){var el=document.getElementById('v-'+k);if(el)el.hidden=(k!==sv);});
    if(sv==='mitre'&&window.__loadMitre)window.__loadMitre();
  }
  showPer();
});
document.getElementById('engtabs').addEventListener('click',function(e){var b=e.target.closest('.subtab');if(!b)return;
  document.querySelectorAll('#engtabs .subtab').forEach(function(t){t.classList.toggle('active',t===b);});
  var sv=b.dataset.sv;
  ['geral','deteccao','alertas','capacidade','mitre'].forEach(function(k){var el=document.getElementById('v-'+k);if(el)el.hidden=(k!==sv);});
  if(sv==='mitre'&&window.__loadMitre)window.__loadMitre();
  showPer();
});

/* ---------- gráficos ---------- */
function lineSVG(series,opts){opts=opts||{};var W=opts.w||600,H=opts.h||300,pl=48,pr=26,pt=38,pb=34;
  var xs=series[0].pts.map(function(p){return p.x;});var allY=[];series.forEach(function(s){s.pts.forEach(function(p){allY.push(p.y);});});
  var maxY=opts.max!=null?opts.max:Math.max.apply(null,allY)*1.14,minY=opts.min!=null?opts.min:0;if(maxY===minY)maxY=minY+1;
  var n=xs.length,X=function(i){return pl+(n<=1?0:i*(W-pl-pr)/(n-1));},Y=function(v){return pt+(1-(v-minY)/(maxY-minY))*(H-pt-pb);};
  var every=opts.labelEvery||(series.length>1?3:(n>14?3:(n>8?2:1)));
  var g='';for(var k=0;k<=3;k++){var gy=pt+k*(H-pt-pb)/3,gv=maxY-(k*(maxY-minY)/3);
    g+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)"/>';
    g+='<text class="axis" x="'+(pl-6)+'" y="'+(gy+5).toFixed(1)+'" text-anchor="end">'+(opts.pctY?Math.round(gv)+'%':Math.round(gv))+'</text>';}
  if(opts.marker!=null&&opts.marker>=0){var mx=X(opts.marker);g+='<line x1="'+mx.toFixed(1)+'" y1="'+pt+'" x2="'+mx.toFixed(1)+'" y2="'+(H-pb)+'" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>';}
  series.forEach(function(s,si){var d=s.pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linejoin="round"/>';
    s.pts.forEach(function(p,i){var x=X(i),y=Y(p.y);g+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.4" fill="'+s.color+'"/>';
      if(i%every===0){var lbl=opts.pctY?(Math.round(p.y)+'%'):fmt(p.y);
        var dy=si===0?((i%2)?-15:-31):((i%2)?28:44);
        g+='<text x="'+x.toFixed(1)+'" y="'+(y+dy).toFixed(1)+'" text-anchor="middle" font-size="14" font-weight="700" paint-order="stroke" stroke="var(--panel)" stroke-width="4" stroke-linejoin="round" fill="'+s.color+'">'+lbl+'</text>';}});
    if(opts.marker!=null&&s.pts[opts.marker]){g+='<circle cx="'+X(opts.marker).toFixed(1)+'" cy="'+Y(s.pts[opts.marker].y).toFixed(1)+'" r="6.5" fill="'+s.color+'" stroke="#0E1621" stroke-width="2.5"/>';}});
  var stp=Math.max(1,Math.ceil((n-1)/5)),idxs=[];for(var i=0;i<n;i+=stp)idxs.push(i);if(idxs[idxs.length-1]!==n-1){if((n-1)-idxs[idxs.length-1]<stp)idxs.pop();idxs.push(n-1);}idxs.forEach(function(xi){var anc=xi===0?'start':(xi===n-1?'end':'middle');g+='<text class="axis" x="'+X(xi).toFixed(1)+'" y="'+(H-9)+'" text-anchor="'+anc+'">'+xs[xi]+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>';}
function gaugeSVG(value,cap){var W=280,H=172,cx=140,cy=140,r=98,rr=17;
  var scaleMax=Math.max(cap*1.15,value*1.04);
  function pt(f){f=Math.max(0,Math.min(1,f));var a=(180-f*180)*Math.PI/180;return [cx+r*Math.cos(a),cy-r*Math.sin(a)];}
  function arc(f0,f1){var st=Math.max(2,Math.round((f1-f0)*44)),d='';for(var s=0;s<=st;s++){var f=f0+(f1-f0)*s/st,p=pt(f);d+=(s?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}return d;}
  var gcap=cap/scaleMax,gwarn=0.9*cap/scaleMax,f=value/scaleMax;
  var g='<path d="'+arc(0,1)+'" fill="none" stroke="var(--panel2)" stroke-width="'+rr+'" stroke-linecap="round"/>';
  g+='<path d="'+arc(0,gwarn)+'" fill="none" stroke="#27AE60" stroke-width="'+rr+'" stroke-linecap="round"/>';
  g+='<path d="'+arc(gwarn,gcap)+'" fill="none" stroke="#E0A64B" stroke-width="'+rr+'"/>';
  g+='<path d="'+arc(gcap,1)+'" fill="none" stroke="#E05C5C" stroke-width="'+rr+'" stroke-linecap="round"/>';
  var cp=pt(gcap);g+='<line x1="'+(cp[0]).toFixed(1)+'" y1="'+(cp[1]-rr/2-2).toFixed(1)+'" x2="'+(cp[0]).toFixed(1)+'" y2="'+(cp[1]+rr/2+2).toFixed(1)+'" stroke="var(--ink)" stroke-width="1.5"/>';
  g+='<text x="'+cp[0].toFixed(1)+'" y="'+(cp[1]+rr/2+14).toFixed(1)+'" text-anchor="middle" class="axis">teto</text>';
  var np=pt(f);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+np[0].toFixed(1)+'" y2="'+np[1].toFixed(1)+'" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="5.5" fill="var(--ink)"/>';
  var p=Math.round(value/cap*100),col=value>cap?'#E05C5C':(value>=0.9*cap?'#E0A64B':'#27AE60'),st=value>cap?'ESTOUROU':(value>=0.9*cap?'ATENÇÃO':'OK');
  g+='<text x="'+cx+'" y="'+(cy-34)+'" text-anchor="middle" fill="'+col+'" font-size="30" font-weight="800">'+p+'%</text>';
  g+='<text x="'+cx+'" y="'+(cy-16)+'" text-anchor="middle" fill="var(--muted)" font-size="12.5">'+fmt(value)+' / '+fmt(cap)+' ECU</text>';
  g+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" fill="'+col+'" font-size="12" font-weight="700" letter-spacing="1">'+st+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>';}
function trafficSVG(value,cap){var W=330,H=190;
  var p=Math.round(value/cap*100);
  var status=value>cap?'red':(value>=0.9*cap?'amber':'green');
  var cols={red:'#E05C5C',amber:'#E0A64B',green:'#27AE60'};
  var hx=34,hy=16,hw=74,hh=H-32,cx=hx+hw/2,r=23;
  var top=hy+18+r,bot=H-hy-18-r,mid=(top+bot)/2;
  var lamps=[['red',top],['amber',mid],['green',bot]];
  var defs='<defs><filter id="glw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  var g='<rect x="'+hx+'" y="'+hy+'" width="'+hw+'" height="'+hh+'" rx="16" fill="#0c141c" stroke="var(--line)" stroke-width="1.5"/>';
  lamps.forEach(function(l){var on=(l[0]===status);g+='<circle cx="'+cx+'" cy="'+l[1]+'" r="'+r+'" fill="'+cols[l[0]]+'" opacity="'+(on?1:0.15)+'"'+(on?' filter="url(#glw)"':'')+'/>';});
  var tx=hx+hw+26,cy=H/2;
  g+='<text x="'+tx+'" y="'+(cy-14)+'" fill="'+cols[status]+'" font-size="38" font-weight="800">'+p+'%</text>';
  g+='<text x="'+tx+'" y="'+(cy+10)+'" fill="var(--muted)" font-size="13">'+fmt(value)+' / '+fmt(cap)+' ECU</text>';
  var lbl=status==='red'?'ESTOUROU':(status==='amber'?'ATENÇÃO':'OK');
  g+='<text x="'+tx+'" y="'+(cy+34)+'" fill="'+cols[status]+'" font-size="14" font-weight="700" letter-spacing="1.5">'+lbl+'</text>';
  return '<svg style="min-height:0" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+defs+g+'</svg>';}
function barsH(items,opts){opts=opts||{};var max=opts.max||Math.max.apply(null,items.map(function(i){return i.v;}))||1;
  return '<div class="bars">'+items.map(function(it){var w=Math.round(it.v/max*100);
    return '<div class="bar"><span class="bl" title="'+it.k+'">'+it.k+'</span><div class="btrack"><div class="bfill" style="width:'+w+'%;background:'+(it.color||'var(--brand)')+'"></div></div><span class="bval">'+(opts.fmt?opts.fmt(it.v):fmt(it.v))+'</span></div>';}).join('')+'</div>';}
function tile(v,l,d,cls,tone){return '<div class="card kpi'+(tone?' t-'+tone:'')+'"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+(d?'<div class="d '+(cls||'flat')+'">'+d+'</div>':'')+'</div>';}
function covTone(p){return p>=50?'ok':(p>=25?'warn':'bad');}          // cobertura MITRE
function licTone(c,t){var p=t?c/t*100:0;return c>t?'bad':(p>=90?'warn':'ok');} // licença
function invTone(s,c){var p=c?s/c*100:0;return (p>100||p<90)?'warn':'ok';}      // SIEM×CMDB

/* ---------- render por mês ---------- */
function renderAll(i){
  var cur=E[i],prev=i>0?E[i-1]:null,m=cur.m;
  var aM=findM(DATA.alertsByMonth,m),lM=findM(DATA.lic,m),tM=DATA.techByMonth[m];
  var win=DATA.inv.filter(function(x){return /win/i.test(x.k);})[0]||DATA.inv[0];

  /* ---- VISÃO GERAL ---- */
  var dProd=prev?cur.prod-prev.prod:0;
  var kpis='<div class="grid g6">'+
    tile(fmt(cur.prod),'Casos em produção ('+m+')',(prev?(dProd>=0?'▲ +':'▼ ')+dProd+' vs '+prev.m:'—'),dProd>=0?'up':'down','acc')+
    tile(cur.tecCov+'<small>/'+cur.tecTot+'</small>','Técnicas MITRE',pct(cur.tecCov,cur.tecTot)+'% do framework','flat',covTone(pct(cur.tecCov,cur.tecTot)))+
    tile(cur.subCov+'<small>/'+cur.subTot+'</small>','Subtécnicas MITRE',pct(cur.subCov,cur.subTot)+'% do framework','flat',covTone(pct(cur.subCov,cur.subTot)))+
    tile(aM?fmt(aM.total):'—','Alertas ('+m+')',aM?'':'sem dado neste mês','flat','acc')+
    tile(lM?pct(lM.cons,lM.total)+'%':'—','Consumo licença ('+m+')',lM?fmt(lM.cons)+' / '+fmt(lM.total)+' ECU':'sem dado',lM&&lM.cons>lM.total?'down':'flat',lM?licTone(lM.cons,lM.total):'')+
    tile(pct(win.siem,win.cmdb)+'%','Endpoints Win no SIEM',fmt(win.siem)+' / '+fmt(win.cmdb)+' (atual)','flat',invTone(win.siem,win.cmdb))+
    '</div>';
  var aAll=DATA.alertsByMonth;
  // Destaques AUTOMÁTICOS para o mês selecionado (derivados dos dados da planilha).
  function insightCards(m){
    // 1) Alertas: mês vs mês anterior
    var idx=-1; for(var i=0;i<aAll.length;i++){if(aAll[i].m===m){idx=i;break;}}
    var cA;
    if(idx<0){cA='<div class="callout info"><span class="ic">📊</span><div><b>Alertas</b><p>Sem dado de alertas para '+m+'.</p></div></div>';}
    else{var curA=aAll[idx].total,pA=idx>0?aAll[idx-1]:null;
      if(pA){var d=curA-pA.total,p=pA.total?Math.round(Math.abs(d)/pA.total*100):0,down=d<=0;
        cA='<div class="callout '+(down?'good':'warn')+'"><span class="ic">'+(down?'📉':'📈')+'</span><div><b>'+(down?'Redução de ruído':'Aumento de alertas')+'</b><p>Alertas '+(down?'caíram':'subiram')+' de '+fmt(pA.total)+' ('+pA.m+') para '+fmt(curA)+' ('+m+') — '+p+'%'+(down?' — maturação da detecção e tuning.':' — investigar origem.')+'</p></div></div>';}
      else{cA='<div class="callout info"><span class="ic">📊</span><div><b>Alertas</b><p>'+fmt(curA)+' alertas em '+m+' (início da série).</p></div></div>';}}
    // 2) Licença: consumo vs teto do mês
    var cL;
    if(lM){var pc=pct(lM.cons,lM.total);
      if(lM.cons>lM.total)cL='<div class="callout warn"><span class="ic">⚠️</span><div><b>Estouro de licença</b><p>'+m+': '+fmt(lM.cons)+' de '+fmt(lM.total)+' ECU ('+pc+'%) — acima do teto.</p></div></div>';
      else if(pc>=90)cL='<div class="callout warn"><span class="ic">⚠️</span><div><b>Licença em atenção</b><p>'+m+': '+fmt(lM.cons)+' de '+fmt(lM.total)+' ECU ('+pc+'%) — próximo do teto.</p></div></div>';
      else cL='<div class="callout good"><span class="ic">✅</span><div><b>Licença saudável</b><p>'+m+': '+fmt(lM.cons)+' de '+fmt(lM.total)+' ECU ('+pc+'%).</p></div></div>';}
    else cL='<div class="callout info"><span class="ic">🧾</span><div><b>Licença</b><p>Sem dado de licença para '+m+'.</p></div></div>';
    // 3) Inventário: maior gap SIEM>CMDB (estado atual — a planilha traz snapshot, não série mensal)
    var gaps=(DATA.inv||[]).map(function(x){return {k:x.k,siem:x.siem,cmdb:x.cmdb,gap:x.siem-x.cmdb};}).filter(function(x){return x.gap>0;}).sort(function(a,b){return b.gap-a.gap;});
    var cI;
    if(gaps.length){var g=gaps[0];cI='<div class="callout info"><span class="ic">🗃️</span><div><b>Gap de inventário — '+g.k+'</b><p>'+fmt(g.siem)+' no SIEM vs '+fmt(g.cmdb)+' no CMDB (+'+fmt(g.gap)+') — reconciliar governança. <small style="color:var(--muted)">(atual)</small></p></div></div>';}
    else cI='<div class="callout good"><span class="ic">🗃️</span><div><b>Inventário alinhado</b><p>SIEM não excede o CMDB em nenhuma plataforma.</p></div></div>';
    return cA+cL+cI;
  }

/* ---------- MATRIZ ---------- */
function renderMatriz(DATA){
  var matrix=document.getElementById('mi_matrix');matrix.textContent='';
  DATA.tactics.forEach(function(t){
    var col=document.createElement('div');col.className='col';
    var p=pct(t.tech_cov,t.tech_total);
    var h=document.createElement('div');h.className='chead';
    h.innerHTML='<div class="nm">'+t.name+'</div><div class="ct">'+t.tech_cov+'/'+t.tech_total+' · '+p+'%</div><div class="bar"><i style="width:'+p+'%"></i></div>';
    col.appendChild(h);
    t.techniques.forEach(function(te){
      var tw=document.createElement('div');tw.className='tw';
      var c=document.createElement('div');
      c.className='cell '+te.status+(te.sep?' sep':'')+(te.st>0?' has':'');
      var car=te.st>0?'<span class="car">▶</span>':'';
      var sc=te.st>0?'<span class="sc">'+te.sc+'/'+te.st+'</span>':'';
      c.innerHTML=car+'<span class="tx">'+te.name+'</span>'+sc+(te.sep?'<span class="badge"></span>':'');
      c.dataset.id=te.id;c.dataset.name=te.name.toLowerCase();
      c.dataset.rules=(te.subs.reduce(function(a,s){return a.concat(s.rules);},[]).concat(te.gen)).join(' ').toLowerCase();
      c._te=te;c._tac=t.name;
      tw.appendChild(c);
      if(te.st>0){
        var box=document.createElement('div');box.className='subs';box.hidden=true;
        te.subs.forEach(function(s){
          var e=document.createElement('div');
          e.className='scell '+(s.cov?'cov':'unc');
          e.innerHTML='<span class="sid">'+s.id.split('.')[1]+'</span><span class="snm">'+s.name+'</span>'+(s.sep?'<span class="sbadge"></span>':'');
          e.dataset.id=s.id.toLowerCase();e.dataset.name=s.name.toLowerCase();e.dataset.rules=(s.rules||[]).join(' ').toLowerCase();
          e._s=s;e._tac=t.name;box.appendChild(e);
        });
        tw.appendChild(box);
        c.addEventListener('click',function(){c.classList.toggle('open');box.hidden=!box.hidden;});
      }
      col.appendChild(tw);
    });
    matrix.appendChild(col);
  });
}

/* ---------- RESUMO ---------- */
function renderResumo(DATA){

/* ---------- GAPS ---------- */
function renderGaps(DATA){
  var none=[],part=[];
  DATA.tactics.forEach(function(t){
    t.techniques.forEach(function(te){
      if(te.status==='none') none.push({t:t.name,te:te,score:te.st});
      else if(te.status==='partial') part.push({t:t.name,te:te,gap:te.st-te.sc});
    });
  });
  none.sort(function(a,b){return b.score-a.score;});
  part.sort(function(a,b){return b.gap-a.gap;});
  function item(o,kind){
    var te=o.te;
    var meta = kind==='none'
      ? (te.st>0?'<span class="pill">'+te.st+' subtéc.</span>':'<span class="pill">técnica</span>')
      : '<span class="pill">'+te.sc+'/'+te.st+' cobertas</span>';
    return '<div class="gitem"><span class="gtac">'+o.t+'</span><span class="gid">'+te.id+'</span>'+
      '<span class="gnm">'+te.name+'</span><span class="gmeta">'+meta+'</span></div>';
  }
  var el=document.getElementById('mi_gaps');
  el.innerHTML=
    '<div class="gaphead">SEM COBERTURA — priorize (ordenado por nº de subtécnicas expostas) · '+none.length+' técnicas</div>'+
    '<div class="glist">'+none.slice(0,60).map(function(o){return item(o,'none');}).join('')+'</div>'+
    '<div class="gaphead" style="margin-top:16px">COBERTURA PARCIAL — completar (ordenado por subtécnicas faltantes) · '+part.length+' técnicas</div>'+
    '<div class="glist">'+part.slice(0,60).map(function(o){return item(o,'part');}).join('')+'</div>';
}

/* ---------- CASOS DO MÊS (evolutivo + seletor) ---------- */
function evoSVG(series,selYM){
  var W=860,H=230,pl=40,pr=16,pt=20,pb=36,iw=W-pl-pr,ih=H-pt-pb;
  var max=Math.max(1,Math.max.apply(null,series.map(function(d){return d.count;})));
  var nice=Math.max(1,Math.ceil(max/4)*4||max);
  var n=series.length,gap=Math.min(26,iw*0.04),bw=Math.max(16,(iw-gap*(n-1))/Math.max(1,n));
  var grid='';for(var g=0;g<=4;g++){var gv=Math.round(nice*g/4),gy=pt+ih-(gv/nice*ih);
    grid+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(W-pr)+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"/>'+
      '<text x="'+(pl-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="8" fill="var(--muted)">'+gv+'</text>';}
  var bars=series.map(function(d,i){
    var x=pl+i*(bw+gap),h=Math.round(d.count/nice*ih),y=pt+ih-h,sel=d.ym===selYM;
    return '<g class="evb" data-ym="'+d.ym+'" style="cursor:pointer">'+
      '<rect x="'+x+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" fill="transparent"/>'+
      '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,2)+'" rx="5" fill="'+(sel?'var(--brand)':'var(--cov-b)')+'" opacity="'+(sel?1:.5)+'"/>'+
      '<text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">'+d.count+'</text>'+
      '<text x="'+(x+bw/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="8.5" font-weight="'+(sel?700:500)+'" fill="'+(sel?'var(--ink)':'var(--muted)')+'">'+d.label+'</text>'+
    '</g>';
  }).join('');
  return '<svg class="evchart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">'+grid+bars+'</svg>';
}
function caseCards(list){
  if(!list.length) return '<div class="loading">Nenhum caso de uso criado neste mês.</div>';
  return '<div class="cards">'+list.map(function(r){
    var tp=(r.type||'').toLowerCase();
    var maps=r.maps.map(function(m){
      var su=m.subs&&m.subs.length?' <span class="su">('+m.subs.join(', ')+')</span>':'';
      return '<div class="mp"><b>'+m.tactic+'</b> → '+m.tech+su+'</div>';
    }).join('');
    return '<div class="card"><div class="ct"><span class="tp '+tp+'">'+(r.type||'rule').toUpperCase()+'</span>'+
      '<span class="dt">criado '+r.created+'</span></div><h3>'+r.name+'</h3>'+maps+'</div>';
  }).join('')+'</div>';
}
function renderSetembro(DATA){
  var S=DATA.summary,el=document.getElementById('mi_setembro');
  var series=S.created_by_month||[],byM=S.created_month_rules||{};
  if(!series.length){
    // fallback: só o mês corrente (schema antigo)
    el.innerHTML='<div class="card">'+caseCards(S.sept_rules||[])+'</div>';return;
  }
  var sel=window.__miSelYM;
  if(!sel||(sel!==S.cur_ym&&!byM[sel])) sel=S.cur_ym||series[series.length-1].ym;
  window.__miSelYM=sel;
  var selLabel=(series.filter(function(d){return d.ym===sel;})[0]||{}).label||sel;
  var total=series.reduce(function(a,d){return a+d.count;},0);
  var list=byM[sel]||[];
  el.innerHTML=
    '<div class="card evcard"><h3>Evolução de casos de uso criados <small>mês a mês · '+total+' no total · clique numa barra para detalhar</small></h3>'+
      '<div class="evsel">'+series.map(function(d){return '<button class="mchip'+(d.ym===sel?' on':'')+'" data-ym="'+d.ym+'">'+d.label+' · '+d.count+'</button>';}).join('')+'</div>'+
      evoSVG(series,sel)+
    '</div>'+
    '<div class="card"><h3>Casos criados em '+selLabel+' <small>('+list.length+')</small></h3>'+caseCards(list)+'</div>';
}

function posT(e){var pad=14,x=e.clientX+pad,y=e.clientY+pad,r=tip.getBoundingClientRect();

document.getElementById('mi_q').addEventListener('input',function(){var v=this.value.trim().toLowerCase();

/* termômetro legível: barra com faixas + ponteiro do mês atual + chips por mês */
function zoneOf(v,bounds){if(v==null)return 1;if(v<bounds[0])return 0;if(v<bounds[1])return 1;return 2;}

    if(v<bounds[1])return W[0]+((v-bounds[0])/(bounds[1]-bounds[0]))*W[1];
    return W[0]+W[1]+Math.min((v-bounds[1])/bounds[1],1)*W[2];}

  for(var k=0;k<=3;k++){var gy=pt+k*(H-pt-pb)/3,val=mx-k*(mx-mn)/3;g+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(gy+4).toFixed(1)+'" fill="var(--muted)" font-size="8" text-anchor="end">'+val.toFixed(0)+'</text>';}
  g+='<path d="'+pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
  pts.forEach(function(p,i){g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.6" fill="'+color+'"/><text x="'+X(i).toFixed(1)+'" y="'+(Y(p.y)-7).toFixed(1)+'" fill="var(--ink)" font-size="8" font-weight="700" text-anchor="middle">'+f2(p.y)+'%</text><text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" fill="var(--muted)" font-size="8" text-anchor="middle">'+p.x.split("/")[0]+'</text>';});
  return g+'</svg>';}
function fpStackSVG(rows){var W=560,H=190,pl=46,pr=12,pt=24,pb=26;
  var max=Math.max.apply(null,rows.map(function(r){return r.fp+r.tp;}))||1,n=rows.length,bw=Math.min(40,(W-pl-pr)/n*0.55);
  var g='<svg viewBox="0 0 '+W+' '+H+'" width="100%" font-family="Segoe UI">';
  for(var k=0;k<=3;k++){var gy=pt+k*(H-pt-pb)/3;g+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)"/>';}
  rows.forEach(function(r,i){var cx=pl+(i+.5)*(W-pl-pr)/n,x=cx-bw/2,yb=H-pb;
    [['fp','var(--crit)'],['tp','var(--c1)']].forEach(function(s){var v=r[s[0]]||0,h=v/max*(H-pt-pb);yb-=h;if(h>0){g+='<rect x="'+x.toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+s[1]+'"/>';if(h>=11)g+='<text x="'+cx.toFixed(1)+'" y="'+(yb+h/2+3).toFixed(1)+'" fill="#fff" font-size="7.5" font-weight="600" text-anchor="middle">'+fN(v)+'</text>';}});
    g+='<text x="'+cx.toFixed(1)+'" y="'+(yb-4).toFixed(1)+'" fill="var(--ink)" font-size="8.5" font-weight="700" text-anchor="middle">'+fN((r.fp||0)+(r.tp||0))+'</text>';
    g+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" fill="var(--muted)" font-size="8" text-anchor="middle">'+r.m.split("/")[0]+'</text>';});
  return g+'</svg>';}
function renderFp(fp,sel){
  if(!fp){document.getElementById('cs_fp').innerHTML='<div class="loading">Sem dados de Falsos Positivos.</div>';return;}
  var idx=[]; fp.months.forEach(function(m,i){if(sel.indexOf(m)>=0)idx.push(i);}); if(!idx.length)return;
  var sum=function(arr){var s=0;idx.forEach(function(i){s+=(arr&&arr[i]!=null?arr[i]:0);});return s;};
  // série mensal filtrada
  var pm=fp.per_month.filter(function(r){return sel.indexOf(r.m)>=0;});
  var sFP=0,sTP=0,sAuto=0,sMin=0; pm.forEach(function(r){sFP+=r.fp;sTP+=r.tp;sAuto+=r.fp_auto;sMin+=r.auto_min;});
  var L=pm.length-1,P=L-1;
  var rate=function(r){return (r.fp+r.tp)?r.fp/(r.fp+r.tp)*100:0;};
  var curRate=L>=0?rate(pm[L]):0, prevRate=P>=0?rate(pm[P]):null;
  var prec=L>=0&&(pm[L].fp+pm[L].tp)?pm[L].tp/(pm[L].fp+pm[L].tp)*100:0;
  var autoPct=sFP?sAuto/sFP*100:0, horas=sMin/60;
  var dRate=prevRate!=null?curRate-prevRate:null;
  var dTxt=dRate==null?'':('<div class="d '+(dRate<=0?'up':'down')+'">'+(dRate<=0?'▼':'▲')+' '+(dRate>0?'+':'')+f2(dRate)+' p.p. vs '+pm[P].m+'</div>');
  var card=function(v,l,cls,d){return '<div class="card kpi '+cls+'"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+(d||'')+'</div>';};
  // tecnologia (período)
  var techArr=Object.keys(fp.tech).map(function(t){return {k:t,v:sum(fp.tech[t])};}).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
  var tmax=techArr.length?techArr[0].v:1;
  var techHtml=techArr.map(function(t){return '<div class="rrow"><div class="rname" title="'+t.k+'">'+t.k+'</div><div class="rbar"><i style="width:'+(t.v/tmax*100).toFixed(1)+'%"></i></div><div class="rval">'+fN(t.v)+'</div></div>';}).join('')||'<div class="loading">Sem FP no período.</div>';
  // regras (período) top 8
  var totFP=sFP||1;
  var rl=fp.rules.map(function(r){return {t:r.title,tec:r.tech,v:sum(r.pm)};}).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;}).slice(0,8);
  var ruleHtml=rl.map(function(r){return '<tr><td>'+r.t+'</td><td>'+r.tec+'</td><td class="n">'+fN(r.v)+'</td><td class="n">'+f2(r.v/totFP*100)+'%</td></tr>';}).join('')||'<tr><td colspan="4" style="color:var(--muted)">Sem FP no período.</td></tr>';
  // heatmap (período)
  var techsH=Object.keys(fp.heat).map(function(t){var tot=0;SEV.forEach(function(s){tot+=sum(fp.heat[t][s]);});return {k:t,tot:tot};}).filter(function(x){return x.tot>0;}).sort(function(a,b){return b.tot-a.tot;}).slice(0,8);
  var allV=[];techsH.forEach(function(t){SEV.forEach(function(s){allV.push(sum(fp.heat[t.k][s]));});});
  var hmax=Math.max.apply(null,allV)||1;
  function hcol(v){var r=v/hmax; if(r>=0.5)return '#E05C5C'; if(r>=0.15)return '#E0A64B'; if(r>0)return '#3a5a42'; return '#16222c';}
  var hm='<div class="hd"></div>'+SEV.map(function(s){return '<div class="hd">'+s+'</div>';}).join('');
  techsH.forEach(function(t){hm+='<div class="rl">'+t.k+'</div>'+SEV.map(function(s){var v=sum(fp.heat[t.k][s]);return '<div class="cell" style="background:'+hcol(v)+';color:'+(v/hmax>=0.15?'#0c1420':'#9fb0bd')+'">'+fN(v)+'</div>';}).join('');});
  var hmStyle='grid-template-columns:150px repeat('+SEV.length+',1fr)';

  document.getElementById('cs_fp').innerHTML=''+
  '<div class="row r4">'+
    card(f2(curRate)+'%','Taxa de Falsos Positivos'+(pm.length?' — '+pm[L].m:''),'t-bad',dTxt)+
    card(f2(prec)+'%','Precisão (True Positive)','t-ok','')+
    card(f2(autoPct)+'%','FP tratados pela IA (sem humano)','t-acc','<div class="d">'+fN(sAuto)+' de '+fN(sFP)+' FP</div>')+
    card(fN(Math.round(horas))+' h','Horas poupadas pela IA (período)','t-acc','<div class="d">FP auto × MTTA de triagem</div>')+
  '</div>'+
  '<div class="row r2">'+
    '<div class="card"><h3>Taxa de FP <small>mês a mês</small></h3>'+fpLineSVG(pm.map(function(r){return {x:r.m,y:rate(r)};}),'var(--crit)')+'</div>'+
    '<div class="card"><h3>Falsos Positivos × True Positives <small>volume/mês</small></h3>'+fpStackSVG(pm)+
      '<div class="sevleg"><span class="it"><span class="sw" style="background:var(--crit)"></span>Falso Positivo</span><span class="it"><span class="sw" style="background:var(--c1)"></span>True Positive</span></div></div>'+
  '</div>'+
  '<div class="row r2">'+
    '<div class="card"><h3>FP por Tecnologia <small>(onde tunar primeiro)</small></h3><div class="rank">'+techHtml+'</div></div>'+
    '<div class="card"><h3>Top regras geradoras de FP <small>(backlog de tuning)</small></h3><table><thead><tr><th>Regra / Título</th><th>Tecnologia</th><th class="n">FP</th><th class="n">% do total</th></tr></thead><tbody>'+ruleHtml+'</tbody></table></div>'+
  '</div>'+
  '<div class="row"><div class="card"><h3>Heatmap — FP por Tecnologia × Severidade</h3><div class="hm" style="'+hmStyle+'">'+hm+'</div></div></div>';
}
function applyCs(){var sel=selectedMonths();if(!sel.length)return;renderCsirt(filterData(CS,sel));renderFp(CS.fp,sel);}
function buildPeriod(){
  var head=document.getElementById('cs_head');
  head.innerHTML='<div class="csper"><span class="csper-l">📅 Período:</span>'+
    CS.months.map(function(m){return '<button class="cschip on" data-m="'+m+'">'+m+'</button>';}).join('')+
    '<button class="cschip csall">Todos</button></div>';
  if(head._wired)return; head._wired=true;
  head.addEventListener('click',function(e){
    if(e.target.closest('.csall')){document.querySelectorAll('#cs_head .cschip:not(.csall)').forEach(function(b){b.classList.add('on');});applyCs();return;}
    var c=e.target.closest('.cschip');if(!c)return;
    var on=document.querySelectorAll('#cs_head .cschip.on:not(.csall)');
    if(c.classList.contains('on')&&on.length<=1)return; // manter ao menos 1
    c.classList.toggle('on');applyCs();
  });
}
var _csLoaded=false;
function bootCs(d){CS=d;try{window.__setUpd(d&&d.updated);}catch(e){}buildPeriod();applyCs();}
document.getElementById('soctabs').addEventListener('click',function(e){var b=e.target.closest('.subtab');if(!b)return;
  document.querySelectorAll('#soctabs .subtab').forEach(function(t){t.classList.toggle('active',t===b);});
  var fp=b.dataset.sq==='fp';
  document.getElementById('cs_body').hidden=fp;
  document.getElementById('cs_fp').hidden=!fp;
});
function loadCsirt(){
  if(_csLoaded)return; _csLoaded=true;
  bootCs(CSIRT_SNAPSHOT); // render imediato
  if(window.google&&google.script&&google.script.run){
    var ok=function(d){if(d&&d.months&&d.months.length)bootCs(d);};
    google.script.run.withSuccessHandler(ok).withFailureHandler(function(){}).getCsirt();
    setInterval(function(){google.script.run.withSuccessHandler(ok).withFailureHandler(function(){}).getCsirt();},2*60*60*1000);
  }
}
window.__loadCsirt=loadCsirt;
/* CSIRT é a aba padrão: esconde o seletor global de período e carrega ao abrir a página */
try{var _pc=document.getElementById('perCtrl');if(_pc)_pc.style.display='none';}catch(e){}
loadCsirt();
})();
</script>
